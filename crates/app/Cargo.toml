[package]
name = "terminal-vibes"
version = "1.7.0"
edition = "2021"
description = "Terminal-based music visualizer for system audio"
license = "MIT"
repository = "https://github.com/joelmgallant/terminal-vibes"
readme = "../../README.md"
keywords = ["audio", "visualizer", "terminal", "music", "tui"]
categories = ["command-line-utilities", "multimedia::audio", "visualization"]

[dependencies]
terminal-vibes-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dependencies.wgpu]
version = "24"
optional = true

[dependencies.winit]
version = "0.30"
optional = true

[dependencies.notify]
version = "7"
optional = true

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dev-dependencies]
approx = "0.5"

[features]
default = []
gui = ["dep:wgpu", "dep:winit", "dep:notify", "dep:bytemuck", "dep:pollster"]
